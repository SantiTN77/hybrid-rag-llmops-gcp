[project]
name = "hybrid-rag-api"
version = "1.0.0"
description = "Enterprise Hybrid RAG API on Private Cloud Run v2 with Firestore Vector Search and Vertex AI Gemini 3.8 Flash"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-genai>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
