[project]
name = "hybrid-rag-evaluator"
version = "1.0.0"
description = "Automated LLMOps Evaluation Pipeline and Pre-Deployment Quality Gate for Hybrid RAG"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "google-auth>=2.35.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-genai>=1.10.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator"]
