[project]
name = "hybrid-rag-ingestion-job"
version = "1.0.0"
description = "Asynchronous GCS-to-Firestore Vector Search ingestion job using Vertex AI embeddings"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-genai>=1.10.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_job"]
