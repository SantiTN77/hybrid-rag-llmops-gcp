# GCP Cloud Workflow: Asynchronous Hybrid RAG Ingestion & Telemetry Orchestrator
# Triggers the Cloud Run v2 Ingestion Job, waits for completion, and logs structured telemetry.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${default(map.get(args, "region"), "us-central1")}
          - job_name: ${default(map.get(args, "job_name"), "hybrid-rag-ingestion-job")}
          - trigger_source: ${default(map.get(args, "trigger_source"), "manual")}

    - log_start:
        call: sys.log
        args:
          severity: "INFO"
          json:
            event_type: "rag_workflow_ingestion_started"
            project_id: ${project_id}
            region: ${region}
            job_name: ${job_name}
            trigger_source: ${trigger_source}

    - run_ingestion_job:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/" + job_name}
        result: job_execution

    - log_complete:
        call: sys.log
        args:
          severity: "INFO"
          json:
            event_type: "rag_workflow_ingestion_completed"
            project_id: ${project_id}
            job_name: ${job_name}
            execution_name: ${job_execution.name}

    - return_summary:
        return:
          status: "SUCCEEDED"
          job_name: ${job_name}
          execution_name: ${job_execution.name}
